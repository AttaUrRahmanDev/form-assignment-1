body{

}

  <body>
    <header>
      <h1>Send Us A Messsage</h1>
    </header>

    <form action="mailto:urrahmana04@gmail.com">
      <input
        type="text"
        name="name"
        id="name"
        placeholder="Full Name"
        required
      /><br />
      <input
        type="email"
        name="email"
        id="email"

send
