<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Send Us A Messsage</h1>
    </header>

    <form action="">
      <input
        type="text"
        name="name"
        id="name"
        placeholder="Full Name"
        required
      /><br />
      <input
        type="email"
        name="email"
        id="email"
        placeholder="E-mail"
        required
      /><br />
      <input
        type="tel"
        name="phone"
        id="phone"
        placeholder="Phone"
        required
      /><br />
      <textarea name="msg" id="msg" placeholder="Your Message"></textarea>
      <button type="submit">Submit</button>
    </form>
  </body>
</html>
